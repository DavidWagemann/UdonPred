# Each dataset's `path` basename (e.g. "trizod") doubles as the Hub config/target
# name under udonpred/datasets, used to fetch precomputed embeddings when
# config.embeddings.source is "auto"/"hub".
# `post` is the target's output activation: a sigmoid for [0, 1] labels, none
# for unbounded regressions. It replaces config.post when training one target.

trizod:
  path: "data/split/trizod"
  fraction: 1
  post: [[torch.nn.Sigmoid, {}]]
  losses:
    y:
      - class: udonpred.training.model.losses.MSE
        output: out_-1
        class_arguments: {}
        arguments: []
        weight: 1

  metrics:
    y:
      - class: udonpred.training.model.losses.MAE
        output: out_-1
        class_arguments: {}
        arguments: []
      - class: udonpred.training.model.losses.Spearman
        output: out_-1
        class_arguments: {}
        arguments: []

