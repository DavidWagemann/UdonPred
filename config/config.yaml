# General settings
cuda_devices: 0
run_name: trizod

deepspeed_zero: False

# Training configuration
num_train_epochs: 200
early_stopping: 20
checkpoint: False

# Logging and evaluation
logging:
  logging_steps: 50
  # Evaluate once per epoch, not every N steps: a full validation pass (plus a
  # checkpoint, see below) every few steps dominates wall-clock and stalls the
  # train loop. Must match save_strategy while load_best_model_at_end is set.
  eval_strategy: epoch

# Model saving
saving:
  save_strategy: epoch
  # Cap retained checkpoints so they don't accumulate and fill the (quota'd)
  # output disk, which slows writes over a long run.
  save_total_limit: 3

# Weights & Biases integration
wandb:
  project: UdonPred
  # "end" uploads only the final model; "checkpoint" would upload one artifact
  # every save_steps, whose growing sync backlog slows training over time.
  log_model: end

# Model architecture parameters
input_dim: 1024
output_dim: 1
max_single_batch_size: 2
heads: ["out"]
pre: {"out": []}
#post: {"out": []}
post: {"out": [[torch.nn.Sigmoid, {}]]}
outputs: ["out_-1"]

# Data processing
cluster: False
filter: False
# Minimum protein length (residues) to train/validate/test on; 0 keeps all.
# e.g. 50 or 100 to restrict to longer proteins, dropping short peptides.
min_length: 0

# Hyperparameter configuration
hyperparameter_path: config/architecture.yaml

# Backbone model configuration
backbone:
  name: "Rostlab/ProstT5_fp16"
  tokenizer_type: "T5Tokenizer"
  model_type: "T5EncoderModel"
  prefix_token: "<AA2fold>"
  preprocessing_batch_size: 1

# Embeddings: "auto" prefers precomputed embeddings from the Hub for the
# backbone pLM (per dataset), falling back to on-the-fly compute; "compute"
# always computes locally.
# `plm` overrides the embeddings slug (default: derived from backbone.name);
# set it to fetch a different pLM's precomputed embeddings (e.g. frustraiseq)
# while keeping backbone.name for tokenization/on-the-fly fallback.
embeddings:
  source: hub
  plm: frustraiseq

# Optimization configuration
optim:
  backend: optuna
  n_trials: 2
  timeout: 72000
  direction: minimize
